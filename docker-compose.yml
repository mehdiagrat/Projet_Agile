services:

    frontend:
      build: ./Frontend
      ports:
        - "3000:80"
      depends_on:
        - backend
  
    backend:
      build: ./Backend
      ports:
        - "5000:5000"
      environment:
        - MONGO_URI=mongodb://mongodb:27017/projet_agile
      depends_on:
        - mongodb
  
    mongodb:
      image: mongo:8
      ports:
        - "27017:27017"
      volumes:
        - mongo_data:/data/db
  
  volumes:
    mongo_data: